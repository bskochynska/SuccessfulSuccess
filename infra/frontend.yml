AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings frontend: the Next.js static export in a private S3 bucket, served
  over HTTPS by CloudFront through origin access control, optionally on a
  custom domain.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional custom domain for the site (app.example.com). Needs
      CertificateArn. Empty serves the site on the distribution's own
      *.cloudfront.net name.

  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate for DomainName, issued in us-east-1
      (`make aws-frontend-cert` requests and validates it).

  HostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route 53 hosted zone serving DomainName. When set, the stack points the
      domain at the distribution; otherwise add a CNAME to the distribution's
      domain at your DNS provider.

  PricingPlan:
    Type: String
    Default: FREE
    AllowedValues: [FREE, PAY_AS_YOU_GO]
    Description: >-
      FREE subscribes the distribution to CloudFront's flat-rate Free plan.
      PAY_AS_YOU_GO skips the subscription there.

Conditions:
  HasFreePlan: !Equals [!Ref PricingPlan, FREE]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasZone: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-frontend"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-index-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve folder/index.html for clean URLs
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} frontend"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt Bucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  PricingPlanSubscription:
    Type: AWS::PricingPlanManager::Subscription
    Condition: HasFreePlan
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      UsageLevel: DEFAULT
      ResourceArns:
        - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  AliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SiteUrl:
    Description: Where the app is served (the custom domain when there is one)
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Description: Point a custom domain's CNAME here when its DNS is not in Route 53
    Value: !GetAtt Distribution.DomainName
  AllowedOrigins:
    Description: Every origin the site is served from, for the backend's CORS
    Value: !If
      - HasDomain
      - !Sub "https://${Distribution.DomainName},https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  BucketName:
    Value: !Ref Bucket
  DistributionId:
    Value: !Ref Distribution
  PricingPlanStatus:
    Description: ACTIVE once the distribution is on the Free plan
    Value: !If [HasFreePlan, !GetAtt PricingPlanSubscription.Status, PAY_AS_YOU_GO]
