name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-ci:
    name: Backend Linter & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # --- ДОДАНО: Служба PostgreSQL для тестів ---
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend dependencies
        run: uv sync

      - name: Run Ruff (Linter)
        run: uv run ruff check .

      - name: Run Tests
        # --- ДОДАНО: Адреса підключення до тестової БД ---
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/spry
        run: |
          if [ -d "tests" ]; then
            uv run pytest
          else
            echo "No tests directory found, skipping pytest."
          fi

  frontend-ci:
    name: Frontend Linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
