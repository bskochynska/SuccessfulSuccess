AWSTemplateFormatVersion: '2010-09-09'
Description: Event-driven Weekly Report Generator Infrastructure

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateRouteTableId:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  BackendImageUri:
    Type: String
    Description: ECR URI of the backend container image
  DatabaseUrl:
    Type: String
    NoEcho: true
  SenderEmail:
    Type: String
    Description: Verified email address in Amazon SES for sending reports
  RecipientEmail:
    Type: String
    Description: Email address to receive the report CSV

Resources:

  # =========================================================================
  # 1. S3 Bucket & Gateway VPC Endpoint
  # =========================================================================

  # Explicit name prevents circular dependency with Lambda Permission
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerLambdaPermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableId

  # =========================================================================
  # 2. SQS Queue and Dead-Letter Queue (DLQ)
  # =========================================================================

  ReportRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360 # 6x Lambda timeout (60s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDLQ.Arn
        maxReceiveCount: 3

  # =========================================================================
  # 3. Builder Lambda (inside VPC)
  # =========================================================================

  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BuilderS3AndSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      PackageType: Image
      Code:
        ImageUri: !Ref BackendImageUri
      ImageConfig:
        Command:
          - app.reports.lambda_handler.handler
      Role: !GetAtt BuilderRole.Arn
      Timeout: 60
      MemorySize: 512
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          REPORTS_BUCKET_NAME: !Ref ReportsBucket
          DATABASE_URL: !Ref DatabaseUrl

  BuilderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref BuilderFunction
      Enabled: true

  # =========================================================================
  # 4. EventBridge Scheduler (Trigger 1 -> SQS)
  # =========================================================================

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn

  WeeklyReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report-schedule"
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: "Europe/Kyiv"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # =========================================================================
  # 5. Mailer Lambda (outside VPC) & SES Integration
  # =========================================================================

  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MailerS3AndSESPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAIL: !Ref RecipientEmail
      Code:
        ZipFile: |
          import json
          import os
          import logging
          import boto3
          from email.message import EmailMessage

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          s3_client = boto3.client("s3")
          ses_client = boto3.client("sesv2")

          def handler(event, context):
              sender = os.environ.get("SENDER_EMAIL")
              recipient = os.environ.get("RECIPIENT_EMAIL")

              s3_record = event["Records"][0]["s3"]
              bucket_name = s3_record["bucket"]["name"]
              object_key = s3_record["object"]["key"]

              logger.info("report-mailer triggered", extra={"trigger": "s3", "bucket": bucket_name, "key": object_key})
              print(f"REPORT_MAILER_LOG: trigger=s3 bucket={bucket_name} key={object_key}")

              if not object_key.startswith("reports/") or not object_key.endswith(".csv"):
                  return {"statusCode": 200, "body": "Ignored"}

              response = s3_client.get_object(Bucket=bucket_name, Key=object_key)
              file_content = response["Body"].read()
              filename = os.path.basename(object_key)

              msg = EmailMessage()
              msg["Subject"] = f"Weekly Meetings Report - {filename.replace('.csv', '')}"
              msg["From"] = sender
              msg["To"] = recipient
              msg.set_content(f"Hello,\n\nPlease find attached the weekly meetings report ({filename}).")
              msg.add_attachment(file_content, maintype="text", subtype="csv", filename=filename)

              ses_client.send_email(
                  FromEmailAddress=sender,
                  Destination={"ToAddresses": [recipient]},
                  Content={"Raw": {"Data": msg.as_bytes()}},
              )
              return {"statusCode": 200, "body": "Email sent"}

  MailerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt MailerFunction.Arn
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref "AWS::AccountId"

Outputs:
  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportRequestsQueueUrl:
    Value: !Ref ReportRequestsQueue
